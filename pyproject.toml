[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "debugpy>=1.8.14,<2",
  "isort>=6.0.1,<7",
  "pre-commit>=4.2.0,<5",
  "pytest-cov>=6.2.1,<7",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.3,<0.17"
]

[project]
authors = [
  {email = "mattcoul7@gmail.com", name = "Matt Coulter"}
]
dependencies = [
    "httpx>=0.27,<1",
]
name = "matthewproctor-postcodes"
description = "Typed lookup API for Matthew Proctor's Australian and New Zealand postcode datasets."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "MIT" }
version = "2.0.0"

[tool.hatch.build.targets.sdist]
include = ["src/matthewproctor_postcodes"]

[tool.hatch.build.targets.wheel]
include = ["src/matthewproctor_postcodes"]

[tool.hatch.build.targets.wheel.sources]
"src/matthewproctor_postcodes" = "matthewproctor_postcodes"

[tool.pytest.ini_options]
markers = [
  "integration: Assigns the test to the integration test suite.",
  "regression: Assigns the test to the regression test suite"
]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
exclude = [".git", ".venv", "__pycache__", "proto"]
fixable = ["ALL"]
ignore = [
  "D203", # incompatible with D211
  "D213", # incompatible with D212
  "D104" # missing docstring in public package
]
select = [
  "ARG001", # unused arguments
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "D", # pydocstyle (docstring checks)
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "W" # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
